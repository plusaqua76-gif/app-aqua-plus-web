name: Deploy to TEST - app-aqua-plus-web-test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular SSR (TEST)
        run: npm run build -- --configuration test

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_926499FCFBFB45FF888438BE9948834B }}

      - name: Deploy to Azure Web App (TEST)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aqua-plus-web-test'
          package: .

      - name: Deployment Summary
        run: |
          echo "Deployment to TEST completed successfully"
          echo "URL: https://app-aqua-plus-web-test.azurewebsites.net"
          echo "Environment: TEST"
          echo "API: https://app-aqua-plus-api-test.azurewebsites.net/api/v1"
