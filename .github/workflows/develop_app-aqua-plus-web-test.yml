name: Deploy to TEST - app-aqua-plus-web-test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Compilar Angular SSR para TEST
      - name: Build Angular SSR (TEST)
        run: npm run build -- --configuration test

      # 5. Desplegar directamente usando Publish Profile
      - name: Deploy to Azure Web App (TEST)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aqua-plus-web-test'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_926499FCFBFB45FF8B8438BE9948834B }}
          package: .

      # 6. Resumen del despliegue
      - name: Deployment Summary
        run: |
          echo "======================================"
          echo "Deployment to TEST completed successfully"
          echo "======================================"
          echo "URL: https://app-aqua-plus-web-test.azurewebsites.net"
          echo "Environment: TEST"
          echo "API: https://app-aqua-plus-api-test.azurewebsites.net/api/v1"

