# Build Once, Deploy Anywhere - Angular SSR to Azure (TEST Environment)
#
# Este workflow construye la aplicación UNA SOLA VEZ y la despliega en Azure.
# La configuración específica del ambiente (TEST) se hace mediante variables
# de entorno de Azure App Service, NO mediante diferentes builds.

name: Deploy to TEST - app-aqua-plus-web-test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular SSR (Single Build)
        run: npm run build

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D6AF461FA5C24F4B9F68A0A6680B2F04 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E64924ECF3504939A52FF7004FE59CAA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04E4B3D9D34842DEB8A0B3BEC2453A34 }}

      - name: Configure Azure App Settings (TEST)
        run: |
          az webapp config appsettings set \
            --name app-aqua-plus-web-test \
            --resource-group $(az webapp show --name app-aqua-plus-web-test --query resourceGroup -o tsv) \
            --settings \
              API_URL="https://app-aqua-plus-api-test.azurewebsites.net/api/v1" \
              AZURE_BLOB_STORAGE_URL="https://staquaplustest.blob.core.windows.net" \
              APP_ENV="test"

      - name: Deploy to Azure Web App (TEST)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aqua-plus-web-test'
          slot-name: 'Production'
          package: dist/aqua-plus

      - name: Deployment Summary
        run: |
          echo "Deployment to TEST completed successfully"
          echo "URL: https://app-aqua-plus-web-test.azurewebsites.net"
          echo "Environment: TEST"
          echo "API: https://app-aqua-plus-api-test.azurewebsites.net/api/v1"


