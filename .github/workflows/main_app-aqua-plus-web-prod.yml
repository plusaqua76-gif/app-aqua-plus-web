name: Build and deploy Node.js app to Azure Web App - app-aqua-plus-web-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy: # Unimos build y deploy en un solo job para evitar el error de storage
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        run: |
          npm install
          npm run build:ssr:prod
          npm ci --omit=dev # Instalamos dependencias de prod aquí mismo

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_13FFE1A52AC8493186D25485A42E2231 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0D8A9E5888704B12B3CC580CCE82C0A0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94745A0832814300AFC99A181290D578 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aqua-plus-web-prod'
          slot-name: 'Production'
          package: . # Sube el contenido actual del runner directamente
