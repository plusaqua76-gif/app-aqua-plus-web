
# Build Once, Deploy Anywhere - Angular SSR to Azure
# PRODUCTION Environment

name: Deploy to PRODUCTION - app-aqua-plus-web-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # 1. Descargar código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Compilar Angular SSR para PRODUCCIÓN
      - name: Build Angular SSR (PRODUCTION)
        run: |
          rm -rf dist
          npm run build -- --configuration production

      # 5. Instalar solamente dependencias de producción
      - name: Install production dependencies only
        run: npm ci --omit=dev

      # 6. Preparar paquete de despliegue
      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -r dist deploy/dist
          cp package.json deploy/package.json
          cp -r node_modules deploy/node_modules

      # 7. Autenticarse en Azure mediante Service Principal
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_13FFE1A52AC8493186D25485A42E2231 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0D8A9E5888704B12B3CC580CCE82C0A0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_94745A0832814300AFC99A181290D578 }}

      # 8. Desplegar en Azure Web App
      - name: Deploy to Azure Web App (PRODUCTION)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aqua-plus-web-prod'
          package: deploy

      # 9. Resumen
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Deployment to PRODUCTION completed"
          echo "=========================================="
          echo "URL: https://app-aqua-plus-web-prod.azurewebsites.net"
          echo "Environment: PRODUCTION"
          echo "API: https://app-aqua-plus-api.azurewebsites.net/api/v1"

