<div class="recover-password-container">
  <button
    [routerLink]="['/auth/login']"
    class="back-button"
    type="button"
    aria-label="Volver al login"
  >
    <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12l4-4m-4 4 4 4"/>
    </svg>
  </button>

  <img src="blob.svg" class="blob" alt="Blob" />
  <div class="orbit"></div>

  <div class="recover-password">
    <img src="/images/logoAquaplus.webp" alt="Logo" />
    <h2>Nueva Contraseña</h2>
    <h3>Por favor, ingresa tu nueva contraseña para completar el proceso de recuperación.</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <i class="fa fa-lock icon"></i>
        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Nueva Contraseña..."
          autocomplete="new-password"
        />
        <i
          [class]="showPassword ? 'fas fa-eye eye-icon' : 'fas fa-eye-slash eye-icon'"
          (click)="togglePasswordVisibility()"
        ></i>
      </div>

      <div class="form-group">
        <i class="fa fa-lock icon"></i>
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Verificar Contraseña..."
          autocomplete="new-password"
        />
        <i
          [class]="showConfirmPassword ? 'fas fa-eye eye-icon' : 'fas fa-eye-slash eye-icon'"
          (click)="toggleConfirmPasswordVisibility()"
        ></i>
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="form.invalid"
      >
        Guardar Contraseña
      </button>
    </form>

    <p>¿Recordaste tu contraseña? <a [routerLink]="['/auth/login']">¡Inicia sesión!</a></p>
  </div>
</div>
