<div class="forgot-password-container">
  <button
    [routerLink]="['/auth/login']"
    class="back-button"
    type="button"
    aria-label="Volver al login"
  >
    <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12l4-4m-4 4 4 4"/>
    </svg>
  </button>

  <img src="blob.svg" class="blob" />
  <div class="orbit"></div>

  <div class="forgot-password">
    <img src="/images/logoAquaplus.webp" alt="Logo" />
    <h2>Recuperar Contraseña</h2>
    <h3>Ingresa tu dirección de correo electrónico y te enviaremos un mail con instrucciones para recuperar tu contraseña.</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <i class="fa fa-envelope icon"></i>
        <input
          type="email"
          formControlName="correo"
          placeholder="Correo electrónico..."
          autocomplete="email"
        />
      </div>

      <button
        type="submit"
        class="submit-button"
        [disabled]="form.invalid"
      >
        Recuperar Contraseña
      </button>
    </form>

    <p>¿Recordaste tu contraseña? <a [routerLink]="['/auth/login']">¡Inicia sesión!</a></p>
  </div>
</div>
