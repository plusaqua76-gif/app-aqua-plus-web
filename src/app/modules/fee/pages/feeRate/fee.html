<section class="w-full bg-transparent text-gray-200">
  <div class="mx-auto max-w-7xl px-4 py-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8 gap-4">
      <h2 class="text-2xl md:text-3xl font-semibold tracking-tight">
        Configuracion de tarifas
      </h2>
    </div>
    <div class="flex justify-center">
      <div class="w-full max-w-2xl space-y-6">
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"
            >Tipo de tarifa</label
          >
          <div class="flex gap-3">
            <div class="relative flex-1">
              <select
                [(ngModel)]="selectedTipoTarifa"
                (ngModelChange)="onTipoTarifaChange()"
                class="block w-full appearance-none rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 pr-10 text-sm text-gray-100 placeholder-gray-400 outline-none focus:border-gray-300 focus:ring-2 focus:ring-gray-400/40"
              >
                <option [value]="null" class="bg-gray-900">
                  Seleccione una tarifa
                </option>
                @for (tarifa of typeRatesData(); track tarifa.id) {
                <option [value]="tarifa.id" class="bg-gray-900">
                  {{ tarifa.nombre }}
                </option>
                }
              </select>
            </div>

            <button
              type="button"
              (click)="abrirPopupTipoTarifa()"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 text-sm text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-400/40"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 5v14M5 12h14"
                />
              </svg>
            </button>

            <button
              type="button"
              (click)="abrirPopupVisualizarTarifas()"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 text-sm text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-400/40"
              title="Visualizar tipos de tarifa"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300"
            >Tipo de concepto</label
          >
          <div class="flex gap-3">
            <div class="relative flex-1">
              <select
                [(ngModel)]="selectedTipoConcepto"
                (ngModelChange)="onTipoConceptoChange()"
                class="block w-full appearance-none rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 pr-10 text-sm text-gray-100 placeholder-gray-400 outline-none focus:border-gray-300 focus:ring-2 focus:ring-gray-400/40"
              >
                <option [value]="null" class="bg-gray-900">
                  Seleccione un concepto
                </option>
                @for (concepto of typeConceptsData(); track concepto.id) {
                <option [value]="concepto.id" class="bg-gray-900">
                  {{ concepto.descripcion }}
                </option>
                }
              </select>
            </div>

            <button
              type="button"
              (click)="abrirPopupTipoConcepto()"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 text-sm text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-400/40"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 5v14M5 12h14"
                />
              </svg>
            </button>

            <button
              type="button"
              (click)="abrirPopupVisualizarConceptos()"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 text-sm text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-400/40"
              title="Visualizar tipos de conceptos"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            </button>
          </div>
        </div>


        <div>
          <label class="block mb-2 text-sm font-medium text-gray-300">
            Valor tarifa concepto
            @if (mostrarTablaEstratos) {
              <span class="text-xs text-gray-400 ml-2">(Deshabilitado - usando estratos)</span>
            }
          </label>
          <div class="flex gap-3">
            <input
              type="number"
              [(ngModel)]="valorTarifa"
              [disabled]="mostrarTablaEstratos"
              placeholder="0"
              class="block w-full rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 text-sm text-gray-100 placeholder-gray-400 outline-none focus:border-gray-300 focus:ring-2 focus:ring-gray-400/40 disabled:opacity-50 disabled:cursor-not-allowed"
              style="width: 70%;"
            />
            <button
              type="button"
              (click)="toggleTablaEstratos()"
              class="inline-flex items-center justify-center gap-2 rounded-xl border border-gray-600/70 bg-transparent px-4 py-3 text-sm text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-400/40"
              style="width: 30%;"
            >
              <svg
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 5v14M5 12h14"
                />
              </svg>
              {{ mostrarTablaEstratos ? 'Ocultar estratos' : 'Agregar estrato' }}
            </button>
          </div>

          <!-- Checkbox para indCalcularMc -->
          <div class="mt-3">
            <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
              <input
                type="checkbox"
                [checked]="indCalcularMc()"
                (change)="indCalcularMc.set(!indCalcularMc())"
                class="w-4 h-4 text-blue-600 bg-transparent border border-gray-600 rounded focus:ring-blue-500 focus:ring-2"
              />
              <span>Calcular MC automáticamente</span>
            </label>
          </div>
        </div>
        @if (mostrarTablaEstratos) {
        <div class="space-y-4">
          <div class="rounded-xl border border-gray-600/70 bg-transparent p-4">
            <h4 class="text-sm font-medium text-gray-300 mb-3">
              Agregar nuevo estrato
            </h4>
            <div class="flex gap-3">
              <div class="flex-1">
                <label class="block mb-1 text-xs text-gray-400"
                  >Número de estrato</label
                >
                <input
                  type="number"
                  [(ngModel)]="nuevoEstratoNumero"
                  min="1"
                  class="block w-full rounded-lg border border-gray-600/70 bg-transparent px-3 py-2 text-sm text-gray-100 placeholder-gray-400 outline-none focus:border-gray-300 focus:ring-1 focus:ring-gray-400/40"
                />
              </div>
              <div class="flex-1">
                <label class="block mb-1 text-xs text-gray-400">Valor</label>
                <input
                  type="number"
                  [(ngModel)]="nuevoEstratoValor"
                  min="0"
                  placeholder="0"
                  class="block w-full rounded-lg border border-gray-600/70 bg-transparent px-3 py-2 text-sm text-gray-100 placeholder-gray-400 outline-none focus:border-gray-300 focus:ring-1 focus:ring-gray-400/40"
                />
              </div>
              <div class="flex items-end">
                <button
                  type="button"
                  (click)="agregarNuevoEstrato()"
                  [disabled]="!nuevoEstratoValor || nuevoEstratoValor <= 0"
                  class="inline-flex items-center justify-center rounded-lg border border-gray-600/70 bg-transparent px-3 py-2 text-sm text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-1 focus:ring-gray-400/40 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  <svg
                    class="h-4 w-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 5v14M5 12h14"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="overflow-hidden rounded-xl border border-gray-600/70">
            <table class="min-w-full divide-y divide-gray-600/70">
              <thead>
                <tr>
                  <th
                    class="px-6 py-3 text-left text-sm font-semibold text-gray-200"
                  >
                    Estrato
                  </th>
                  <th
                    class="px-6 py-3 text-left text-sm font-semibold text-gray-200"
                  >
                    Valor
                  </th>
                  <th
                    class="px-6 py-3 text-left text-sm font-semibold text-gray-200"
                  >
                    Acciones
                  </th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-600/70">
                @if (estratosActuales.length === 0) {
                <tr>
                  <td
                    colspan="3"
                    class="px-6 py-4 text-sm text-gray-400 text-center"
                  >
                    No hay estratos configurados
                  </td>
                </tr>
                } @else { @for (estrato of estratosActuales; track estrato.id) {
                <tr>
                  <td class="px-6 py-4 text-sm">{{ estrato.numero }}</td>
                  <td class="px-6 py-4 text-sm">
                    <input
                      type="number"
                      [value]="estrato.valor"
                      (input)="actualizarEstratoValor(estrato.id, +$any($event.target).value)"
                      min="0"
                      class="block w-full rounded border border-gray-600/70 bg-transparent px-2 py-1 text-sm text-gray-100 outline-none focus:border-gray-300 focus:ring-1 focus:ring-gray-400/40"
                    />
                  </td>
                  <td class="px-6 py-4 text-sm">
                    <button
                      type="button"
                      (click)="eliminarEstrato(estrato.id)"
                      class="inline-flex items-center justify-center rounded border border-red-600/70 p-2 text-xs text-red-400 hover:bg-red-500/10 focus:outline-none focus:ring-1 focus:ring-red-500/40"
                      title="Eliminar estrato"
                    >
                      <svg
                        class="h-4 w-4"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7h6m-7 0a2 2 0 012-2h4a2 2 0 012 2m-8 0H5"
                        />
                      </svg>
                    </button>
                  </td>
                </tr>
                } }
              </tbody>
            </table>
          </div>
        </div>
        }

        <!-- Botón Guardar tarifa -->
        <div class="mt-6 space-y-4">
          <button
            type="button"
            (click)="abrirConfirmacionGuardar()"
            [disabled]="!canGuardarTarifa() || guardandoTarifa()"
            class="inline-flex items-center justify-center rounded-xl border border-gray-600/70 bg-transparent px-5 py-3 text-sm font-medium text-gray-200 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-gray-400/40 disabled:opacity-50 disabled:cursor-not-allowed w-full"
          >
            @if (guardandoTarifa()) {
              <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Guardando...
            } @else {
              <svg class="h-4 w-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
              Guardar Tarifa
            }
          </button>

          <!-- Botón Ver Conceptos de Tarifa -->
          <button
            type="button"
            (click)="abrirPopupConceptosTarifaEmpresa()"
            class="inline-flex items-center justify-center gap-2 rounded-xl border border-blue-600/70 bg-blue-500/10 px-6 py-3 text-sm text-blue-400 hover:bg-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-400/40 transition-colors w-full"
            title="Ver conceptos de tarifa configurados"
          >
            <svg
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
              />
            </svg>
            Ver Conceptos de Tarifa
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup para visualizar tipos de tarifa -->
  <app-pop-up
    [open]="showPopupVisualizarTarifas"
    title="Tipos de Tarifa"
    [isConfirmation]="false"
  >
    <div class="space-y-4">
      <div class="max-h-96 overflow-y-auto">
        <app-rate-types-list
          [rateTypes]="typeRatesData()"
          (edit)="onEditRateType($event)"
          (delete)="onDeleteRateType($event)"
        >
        </app-rate-types-list>
      </div>

      <div class="flex justify-end pt-4 border-t border-gray-600/50">
        <button
          type="button"
          (click)="cerrarPopupVisualizarTarifas()"
          class="px-6 py-3 text-sm font-medium text-gray-300 bg-white/10 backdrop-blur-lg border border-white/20 rounded-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/40 transition-all duration-300"
        >
          Cerrar
        </button>
      </div>
    </div>
  </app-pop-up>

  <!-- Popup para agregar/editar tipo de tarifa -->
  <app-pop-up
    [open]="showPopupTipoTarifa"
    [title]="editandoTipoTarifa() ? 'Editar Tipo de Tarifa' : 'Agregar Nuevo Tipo de Tarifa'"
    [isConfirmation]="false"
  >
    <div class="space-y-6">
      <!-- Campo Nombre -->
      <div class="form-group">
        <label for="nombre-tipo-tarifa" class="block mb-3 text-sm font-medium text-gray-300">
          Nombre
        </label>
        <i class="fa fa-tag icon"></i>
        <input
          id="nombre-tipo-tarifa"
          type="text"
          [(ngModel)]="nuevoTipoTarifa.nombre"
          placeholder="Ingrese el nombre"
          autocomplete="off"
          required
        />
      </div>

      <div class="form-group textarea-group">
        <label for="descripcion-tipo-tarifa" class="block mb-3 text-sm font-medium text-gray-300">
          Descripción
        </label>
        <i class="fa fa-align-left icon"></i>
        <textarea
          id="descripcion-tipo-tarifa"
          [(ngModel)]="nuevoTipoTarifa.descripcion"
          placeholder="Descripción opcional del tipo de tarifa"
          rows="3"
        ></textarea>
      </div>

      <div class="flex justify-end gap-3 pt-4">
        <button
          type="button"
          (click)="cerrarPopupTipoTarifa()"
          class="px-6 py-3 text-sm font-medium text-gray-300 bg-white/10 backdrop-blur-lg border border-white/20 rounded-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/40 transition-all duration-300"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="guardarNuevoTipoTarifa()"
          [disabled]="!nuevoTipoTarifa.nombre.trim() || guardandoTipoTarifa()"
          class="px-6 py-3 text-sm font-medium text-white bg-gradient-to-r from-green-600 to-green-700 rounded-xl hover:from-green-700 hover:to-green-800 focus:outline-none focus:ring-2 focus:ring-green-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:-translate-y-px active:translate-y-0"
        >
          @if (guardandoTipoTarifa()) {
          <i class="fa fa-spinner fa-spin mr-2"></i>
          {{ editandoTipoTarifa() ? 'Actualizando...' : 'Guardando...' }} }
          @else { {{ editandoTipoTarifa() ? 'Actualizar' : 'Guardar' }} }
        </button>
      </div>
    </div>
  </app-pop-up>

  <!-- Popup de confirmación para eliminar tipo de tarifa -->
  <app-pop-up
    [open]="showDeleteConfirm"
    [isConfirmation]="true"
    title="Eliminar Tipo de Tarifa"
    [message]="getDeleteConfirmMessage()"
    confirmText="Eliminar"
    cancelText="Cancelar"
    (confirmAction)="confirmDeleteRateType()"
    (cancelAction)="cancelDeleteRateType()"
  >
  </app-pop-up>

  <!-- ===== POPUPS PARA TIPO DE CONCEPTO ===== -->

  <!-- Popup para visualizar tipos de concepto -->
  <app-pop-up
    [open]="showPopupVisualizarConceptos"
    title="Tipos de Concepto"
    [isConfirmation]="false"
  >
    <div class="space-y-4">
      <div class="max-h-96 overflow-y-auto">
        <app-type-concepts-list
          [typeConcepts]="typeConceptsData()"
          (edit)="onEditTypeConcept($event)"
          (delete)="onDeleteTypeConcept($event)"
        >
        </app-type-concepts-list>
      </div>

      <div class="flex justify-end pt-4 border-t border-gray-600/50">
        <button
          type="button"
          (click)="cerrarPopupVisualizarConceptos()"
          class="px-6 py-3 text-sm font-medium text-gray-300 bg-white/10 backdrop-blur-lg border border-white/20 rounded-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/40 transition-all duration-300"
        >
          Cerrar
        </button>
      </div>
    </div>
  </app-pop-up>

  <!-- Popup para agregar/editar tipo de concepto -->
  <app-pop-up
    [open]="showPopupTipoConcepto"
    [title]="editandoTipoConcepto() ? 'Editar Tipo de Concepto' : 'Agregar Nuevo Tipo de Concepto'"
    [isConfirmation]="false"
  >
    <div class="space-y-6">
      <!-- Campo Descripcion -->
      <div class="form-group">
        <label for="descripcion-tipo-concepto" class="block mb-3 text-sm font-medium text-gray-300">
          Descripción
        </label>
        <i class="fa fa-tag icon"></i>
        <input
          id="descripcion-tipo-concepto"
          type="text"
          [(ngModel)]="nuevoTipoConcepto.descripcion"
          placeholder="Ingrese la descripción"
          autocomplete="off"
          required
        />
      </div>



      <div class="flex justify-end gap-3 pt-4">
        <button
          type="button"
          (click)="cerrarPopupTipoConcepto()"
          class="px-6 py-3 text-sm font-medium text-gray-300 bg-white/10 backdrop-blur-lg border border-white/20 rounded-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/40 transition-all duration-300"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="guardarNuevoTipoConcepto()"
          [disabled]="!nuevoTipoConcepto.descripcion.trim() || guardandoTipoConcepto()"
          class="px-6 py-3 text-sm font-medium text-white bg-gradient-to-r from-green-600 to-green-700 rounded-xl hover:from-green-700 hover:to-green-800 focus:outline-none focus:ring-2 focus:ring-green-300 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform hover:-translate-y-px active:translate-y-0"
        >
          @if (guardandoTipoConcepto()) {
          <i class="fa fa-spinner fa-spin mr-2"></i>
          {{ editandoTipoConcepto() ? 'Actualizando...' : 'Guardando...' }} }
          @else { {{ editandoTipoConcepto() ? 'Actualizar' : 'Guardar' }} }
        </button>
      </div>
    </div>
  </app-pop-up>

  <!-- Popup de confirmación para eliminar tipo de concepto -->
  <app-pop-up
    [open]="showDeleteConfirmConcept"
    [isConfirmation]="true"
    title="Eliminar Tipo de Concepto"
    [message]="getDeleteConfirmMessageConcept()"
    confirmText="Eliminar"
    cancelText="Cancelar"
    (confirmAction)="confirmDeleteTypeConcept()"
    (cancelAction)="cancelDeleteTypeConcept()"
  >
  </app-pop-up>

  <!-- Popup para visualizar conceptos de tarifa por empresa -->
  <app-pop-up
    [open]="showPopupConceptosTarifaEmpresa"
    title="Conceptos de Tarifa por Empresa"
    [isConfirmation]="false"
    maxWidth="max-w-7xl"
  >
    <div class="overflow-y-auto" style="max-height: calc(100vh - 330px);">
      <app-concept-rate-enterpice></app-concept-rate-enterpice>
    </div>

    <div class="flex justify-end pt-4 mt-4 border-t border-gray-600/50">
      <button
        type="button"
        (click)="cerrarPopupConceptosTarifaEmpresa()"
        class="px-6 py-3 text-sm font-medium text-gray-300 bg-white/10 backdrop-blur-lg border border-white/20 rounded-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/40 transition-all duration-300"
      >
        Cerrar
      </button>
    </div>
  </app-pop-up>

  <!-- Popup de confirmación para eliminar estrato -->
  <app-pop-up
    [open]="showDeleteConfirmEstrato"
    [isConfirmation]="true"
    title="Eliminar Estrato"
    [message]="getDeleteConfirmMessageEstrato()"
    confirmText="Eliminar"
    cancelText="Cancelar"
    (confirmAction)="confirmDeleteEstrato()"
    (cancelAction)="cancelDeleteEstrato()"
  >
  </app-pop-up>

  <!-- Popup de confirmación para guardar tarifa -->
  <app-pop-up
    [open]="showSaveConfirm"
    [isConfirmation]="true"
    title="Guardar Tarifa Concepto"
    [message]="getSaveConfirmMessage()"
    confirmText="Guardar"
    cancelText="Cancelar"
