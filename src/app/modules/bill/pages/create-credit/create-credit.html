
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200 flex items-center justify-center py-4">
  <div class="max-w-3xl w-full mx-auto p-6">
    <form [formGroup]="abonoForm" (ngSubmit)="onSubmit()" class="backdrop-blur-lg bg-gray-900/70 dark:bg-gray-900/80 p-8 rounded-xl shadow-2xl border border-gray-700/30">
      <h2 class="text-2xl font-semibold text-center mb-6 text-white">Registrar abono</h2>

      <div class="grid grid-cols-1 gap-4">
        <div class="flex flex-col">
          <label for="valor" class="mb-1 font-medium text-white">Valor del abono:</label>
          <input id="valor" type="text" formControlName="valor" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
            placeholder="Ingrese el valor....." />
        </div>

        <div class="flex justify-center mt-4">
          <button type="submit"
            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-md shadow-md cursor-pointer transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            Guardar abono
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
