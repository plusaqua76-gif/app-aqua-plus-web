  
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200 flex items-center justify-center py-4">
    <div class="max-w-3xl w-full mx-auto p-6">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="backdrop-blur-lg bg-gray-900/70 dark:bg-gray-900/80 p-8 rounded-xl shadow-2xl border border-gray-700/30">
            <h2 class="text-2xl font-semibold text-center mb-6 text-white">Agregar deuda de cliente</h2>

            <div *ngIf="showSuccessMessage" class="bg-green-100 dark:bg-green-900/30 border border-green-400 dark:border-green-600 text-green-700 dark:text-green-300 px-4 py-3 rounded relative mb-4 text-center transition-colors duration-200" role="alert">
                <strong class="font-bold">¡Éxito!</strong>
                <span class="block sm:inline">La deuda fue guardada correctamente.</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div class="flex flex-col">
                    <label class="mb-1 font-medium text-white">Cliente:</label>
                    <select formControlName="empresaClienteContador" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        <option [ngValue]="null" disabled>Cliente...</option>
                        @for (cliente of empresaClienteContador; track cliente.id) {
                            <option [ngValue]="cliente">
                                {{ cliente.cliente.nombre }} {{ cliente.cliente.segundoNombre || '' }} {{ cliente.cliente.apellido
                                }} {{ cliente.cliente.segundoApellido || '' }}
                            </option>
                        }
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="mb-1 font-medium text-white">Tipo Deuda:</label>
                    <select formControlName="tipoDeuda" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        <option [ngValue]="null" disabled>Tipo Deuda...</option>
                        @for (tip of tipoDeuda; track tip.id) {
                            <option [ngValue]="tip">{{ tip.nombre }}</option>
                        }
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="mb-1 font-medium text-white">Factura:</label>
                    <select formControlName="factura" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        <option [ngValue]="null" disabled>Factura...</option>
                        @for (fac of facturas; track fac.id) {
                            <option [ngValue]="fac">{{ fac.codigo }}</option>
                        }
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="mb-1 font-medium text-white">N° de cuotas:</label>
                    <select formControlName="plazoPago" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        <option [ngValue]="null" disabled>N° de cuotas...</option>
                        @for (plazo of plazoPago; track plazo.id) {
                            <option [ngValue]="plazo">{{ plazo.nombre }}</option>
                        }
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="mb-1 font-medium text-white">Fecha Deuda:</label>
                    <input type="date" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" formControlName="fechaDeuda" />
                </div>

                <div class="flex flex-col">
                    <label class="mb-1 font-medium text-white">Valor:</label>
                    <input type="text" class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" formControlName="valor" placeholder="Valor" />
                </div>

                <div class="flex flex-col sm:col-span-2">
                    <label class="mb-1 font-medium text-white">Descripción:</label>
                    <textarea class="p-3 border border-gray-600 rounded-md w-full bg-gray-800/80 text-white placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200 resize-none" formControlName="descripcion" rows="3" placeholder="Descripción"></textarea>
                </div>

                <div class="col-span-1 sm:col-span-2 flex justify-center mt-4">
                    <button (ngSubmit)="onSubmit()" type="submit"
                        class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-md shadow-md dark:shadow-gray-700/50 cursor-pointer transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
                        Guardar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
