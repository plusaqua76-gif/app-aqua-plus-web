<div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200 flex items-center justify-center py-4">
    <div class="max-w-7xl w-full mx-auto p-6">
        <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg dark:shadow-gray-700/50 border border-gray-200 dark:border-gray-700" *ngIf="updateForm">
            <h2 class="text-2xl font-semibold text-center mb-6 text-gray-900 dark:text-white">Editar Cliente</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

             
                <div>
                    <label for="tipoDocumento" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tipo de Documento <span class="text-red-500">*</span></label>
                    <select id="tipoDocumento" formControlName="tipoDocumento" class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        @for (tipo of tiposDocumento(); track $index) {
                          <option [value]="tipo.id">{{ tipo.nombre }}</option>
                        }
                    </select>
                </div>


                <div>
                    <label for="numeroDocumento" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Número de Documento</label>
                    <input id="numeroDocumento" formControlName="numeroDocumento" type="text" placeholder="Número de documento..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>


                <div>
                    <label for="correo" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Correo Electrónico</label>
                    <input id="correo" formControlName="correo" type="email" placeholder="Correo..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>


                <div>
                    <label for="primerNombre" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Primer Nombre</label>
                    <input id="primerNombre" formControlName="primerNombre" type="text" placeholder="Primer nombre..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>


                <div>
                    <label for="segundoNombre" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Segundo Nombre</label>
                    <input id="segundoNombre" formControlName="segundoNombre" type="text" placeholder="Segundo nombre..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>


                <div>
                    <label for="primerApellido" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Primer Apellido</label>
                    <input id="primerApellido" formControlName="primerApellido" type="text" placeholder="Primer apellido..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>


                <div>
                    <label for="segundoApellido" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Segundo Apellido</label>
                    <input id="segundoApellido" formControlName="segundoApellido" type="text" placeholder="Segundo apellido..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>

                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Teléfono</label>
                    <input id="telefono" formControlName="telefono" type="text" placeholder="Teléfono..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>

                <div>
                    <label for="idDepartamento" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Departamento <span class="text-red-500">*</span></label>
                    <select id="idDepartamento" formControlName="idDepartamento"
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        <option value="" disabled>
                          @if (departmentsLoading()) { Cargando departamentos... } @else { Seleccione un departamento }
                        </option>
                        @for (item of departamentos(); track $index) {
                          <option [value]="item.id">{{ item.nombre }}</option>
                        }
                    </select>
                </div>

                <div>
                    <label for="idCiudad" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ciudad <span class="text-red-500">*</span></label>
                    <select id="idCiudad" formControlName="idCiudad"
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" required>
                        <option value="" disabled>
                          @if (citiesLoading()) { Cargando ciudades... } @else if (!selectedDepartmentId()) { Seleccione primero un departamento } @else { Seleccione una ciudad }
                        </option>
                        @for (item of ciudades(); track $index) {
                          <option [value]="item.id">{{ item.nombre }}</option>
                        }
                    </select>
                </div>

                <div>
                    <label for="idCorregimiento" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Corregimiento</label>
                    <select id="idCorregimiento" formControlName="idCorregimiento"
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200">
                        <option value="" disabled>
                          @if (corregimientosLoading()) { Cargando corregimientos... } @else if (!selectedCityId()) { Seleccione primero una ciudad } @else { Seleccione un corregimiento }
                        </option>
                        @for (item of corregimientos(); track $index) {
                          <option [value]="item.id">{{ item.nombre }}</option>
                        }
                    </select>
                </div>

                <div class="md:col-span-3">
                    <label for="direccion" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Dirección</label>
                    <input id="direccion" formControlName="direccion" type="text" placeholder="Dirección..."
                        class="w-full p-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 rounded-md border border-gray-300 dark:border-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200" />
                </div>

                <div class="md:col-span-3 flex justify-center mt-4">
                    <button type="button"
                        (click)="onSubmit()"
                        class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-md shadow-md dark:shadow-gray-700/50 cursor-pointer transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800">
                        Actualizar Cliente
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
